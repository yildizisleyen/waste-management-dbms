<head>

    <style>
        body {

            background: linear-gradient(to bottom right, #d4f1d4, #a8e6a1);

            align-items: center;

            margin-bottom: 10px;

            font-size: 1.2em;
            margin-top: 30px;

        }

            margin-top: 40px;
            padding: 12px 30px;
            font-size: 1em;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .login-btn:hover {
            background-color: #388e3c;
        }
    </style>
